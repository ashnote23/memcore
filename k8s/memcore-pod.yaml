apiVersion: v1
kind: Pod
metadata:
  name: memcore
  namespace: memcore
  labels:
    app: memcore
    tier: backend
    component: engine
spec:
  volumes:
    - name: memcore-storage
      persistentVolumeClaim:
        claimName: memcore-data
  containers:
    - name: cpp-engine
      image: memcore-cpp-engine:latest
      imagePullPolicy: Never
      ports:
        - containerPort: 50051
      volumeMounts:
        - name: memcore-storage
          mountPath: /app/data
      envFrom:
        - configMapRef:
            name: memcore-config
        - secretRef:
            name: memcore-secret

    - name: go-api
      image: memcore-go-api:latest
      imagePullPolicy: Never
      ports:
        - containerPort: 8080
      envFrom:
        - configMapRef:
            name: memcore-config
        - secretRef:
            name: memcore-secret
      livenessProbe:
        httpGet:
          path: /due-cards
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 15
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /due-cards
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 3