apiVersion: batch/v1
kind: CronJob
metadata:
  name: memcore-scheduled-check
spec:
  jobTemplate:
    metadata:
      name: memcore-scheduled-check
    spec:
      template:
        metadata: {}
        spec:
          containers:
          - command:
            - /bin/sh
            - -c
            - echo "scheduled check......" &&  date
            image: busybox
            name: memcore-scheduled-check
            resources: {}
          restartPolicy: OnFailure
  schedule: '*/1 * * * *'
status: {}
